name: pmay_app
description: PMAY housing registration app (applicant side)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  file_picker: 8.3.7
  image_picker: ^1.1.2
  image: ^4.1.7
  flutter_cashfree_pg_sdk: ^2.2.10+48
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  signature: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#073D87"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_android12.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_photo.png
    - assets/images/onboarding_bottom.png
    - assets/images/home_banner.jpg
    - assets/images/leader.jpg
    - assets/images/splash.png
    - assets/images/splash_android12.png
    - assets/images/fadnavis.jpg
    - assets/images/auth_header.png